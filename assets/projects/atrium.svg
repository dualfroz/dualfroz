<!-- Atrium - panel zarzadzania hotelami. Znakiem jest arkada: trzy luki na wspolnej posadzce,
     srodkowy wyzszy. Pierwsza wersja byla pojedynczym lukiem z okulusem w srodku i w 44 px
     czytala sie jak klodka - stad arkada, ktora jest jednoznacznie architektura.
     Miedz i mosiadz wziete z palety samego produktu (frontend/src: #C77B3B, #A8853B). -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atrium">
  <defs>
    <linearGradient id="atrium-g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DE9C51"/>
      <stop offset="1" stop-color="#94702E"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#atrium-g)" stroke-linecap="butt">
    <path stroke-width="42" d="M 196 432 L 196 176 A 60 60 0 0 1 316 176 L 316 432"/>
    <path stroke-width="36" d="M 78 432 L 78 268 A 46 46 0 0 1 170 268 L 170 432"/>
    <path stroke-width="36" d="M 342 432 L 342 268 A 46 46 0 0 1 434 268 L 434 432"/>
  </g>
  <rect x="46" y="432" width="420" height="36" rx="18" fill="url(#atrium-g)"/>
</svg>
