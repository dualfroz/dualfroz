<!-- VulBio - osobiste strony wizytowki z wlasnym panelem. Znak jest sylwetka takiej strony
     widzianej z daleka: awatar i pod nim stos klikalnych kart. Pierwsza wersja miala paski
     grubsze i ciasniej - w 44 px zlewaly sie w jedna plame, wiec sa cienesze, z wieksza
     przerwa i wyrazniej rozna dlugoscia. Fiolet z palety produktu (frontend/src: #8f7bff,
     #6c54ff). -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VulBio">
  <defs>
    <linearGradient id="vulbio-g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#B0A0FF"/>
      <stop offset="1" stop-color="#6242FF"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="112" r="80" fill="url(#vulbio-g)"/>
  <rect x="76" y="256" width="360" height="52" rx="26" fill="url(#vulbio-g)"/>
  <rect x="76" y="344" width="360" height="52" rx="26" fill="url(#vulbio-g)"/>
  <rect x="166" y="432" width="180" height="52" rx="26" fill="url(#vulbio-g)"/>
</svg>
