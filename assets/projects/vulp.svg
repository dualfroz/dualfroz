<!-- Vulp - TUI w Rust do zarzadzania workspace'em repozytoriow. Nazwa idzie od vulpes (lis),
     a narzedzie zyje w terminalu, wiec znak laczy jedno z drugim: uszy lisa nad oknem terminala,
     w ktorym w negatywie siedzi znak zachety i kursor. Zielen jest doslownie z kodu vulpa
     (Color::Rgb(57,211,83) i (38,166,65) - kolory wykresu aktywnosci), nie wymyslona. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vulp">
  <defs>
    <linearGradient id="vulp-g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="1" stop-color="#26A641"/>
    </linearGradient>
    <mask id="vulp-m">
      <rect x="72" y="150" width="368" height="302" rx="58" fill="#fff"/>
      <path d="M 166 240 L 230 300 L 166 360" fill="none" stroke="#000" stroke-width="38"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="256" y="342" width="106" height="30" rx="15" fill="#000"/>
    </mask>
  </defs>
  <path fill="url(#vulp-g)" d="M 100 174 L 138 58 L 244 150 Z"/>
  <path fill="url(#vulp-g)" d="M 412 174 L 374 58 L 268 150 Z"/>
  <rect x="72" y="150" width="368" height="302" rx="58" fill="url(#vulp-g)" mask="url(#vulp-m)"/>
</svg>
